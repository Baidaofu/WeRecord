name: Build APK

on:
  push:
    branches: [ data-binding ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Diagnose preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "no ANDROID_HOME content"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null
          echo "--- licenses ---"
          ls "$ANDROID_HOME/licenses" 2>/dev/null
          echo "--- java ---"
          java -version 2>&1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: werecord-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
