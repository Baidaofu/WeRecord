name: Build APK

on:
  push:
    branches: [ data-binding ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Restore excluded source files from git history
        run: |
          # 作者在 b95a229 中移除了含个人信息的文件并加入 .gitignore，
          # 但代码仍有引用，构建前从历史恢复
          git show b95a229^:app/src/main/java/xjunz/tool/werecord/Constants.java > app/src/main/java/xjunz/tool/werecord/Constants.java
          git show b95a229^:app/src/main/java/xjunz/tool/werecord/ui/outer/DebugActivity.java > app/src/main/java/xjunz/tool/werecord/ui/outer/DebugActivity.java
          ls -la app/src/main/java/xjunz/tool/werecord/Constants.java app/src/main/java/xjunz/tool/werecord/ui/outer/DebugActivity.java

      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: werecord-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Paste tail of build log (if failed)
        if: failure()
        run: |
          tail -n 400 gradle-build.log > /tmp/log-tail.txt
          echo "=== uploading log tail to paste.rs ==="
          curl -s --data-binary @/tmp/log-tail.txt https://paste.rs
